<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects · Schedura</title>
  <meta name="description" content="Your Schedura timetable projects." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FFFFFF" />

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/app.css" />

  <style>
    .main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 30px 24px 64px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .page-header h1 {
      font-size: 23px;
      font-weight: 600;
      margin: 0 0 5px;
    }

    .page-header p {
      font-size: 13.5px;
      color: var(--muted);
      margin: 0;
    }

    .search-bar {
      position: relative;
      margin-bottom: 20px;
      max-width: 340px;
    }

    .search-bar svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-bar input { padding-left: 33px; }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 17px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .project-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .project-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .project-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-word;
      line-height: 1.35;
    }

    .project-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 13px;
      line-height: 1.5;
    }

    .project-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
    }

    /* Row actions stay out of the way until the card is hovered or focused —
       three buttons shouting on every card is what makes a grid feel like a
       control panel instead of a list of your work. */
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      opacity: 0;
      transition: opacity .15s;
    }

    .project-card:hover .card-actions,
    .project-card:focus-within .card-actions { opacity: 1; }

    @media (hover: none) { .card-actions { opacity: 1; } }

    .menu-wrap { position: relative; }

    .dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 5px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 168px;
      padding: 5px;
      display: none;
      z-index: 20;
    }

    .dropdown.open { display: block; }

    .dropdown button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }

    .dropdown button:hover { background: var(--surface-sunken); color: var(--text); }
    .dropdown button.danger { color: var(--danger); }
    .dropdown button.danger:hover { background: var(--danger-soft); }

    .share-link-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    .share-link-row input {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="/projects">Schedura</a>
  <div class="topbar-right">
    <span class="topbar-user" id="topbarUser"></span>
    <button class="btn btn-quiet btn-sm" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Projects</h1>
      <p>Open a project to edit its inputs or view the generated schedule.</p>
    </div>
    <button class="btn btn-primary" id="newProjectBtn">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New project
    </button>
  </div>

  <div class="search-bar">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <label class="sr-only" for="searchInput">Search projects</label>
    <input type="text" id="searchInput" placeholder="Search projects" autocomplete="off"/>
  </div>

  <div class="projects-grid" id="projectsGrid"></div>
</main>

<script src="/ui.js"></script>
<script>
const { escHtml, escAttr, toast, relTime } = Schedura;

let allProjects = [];

/* ── Loading ─────────────────────────────────────────────────────────────── */

function renderSkeletons() {
  document.getElementById('projectsGrid').innerHTML = Array.from({ length: 3 }, () => `
    <div class="project-card" style="cursor:default" aria-hidden="true">
      <div class="project-card-top"><div class="skeleton" style="width:34px;height:34px;border-radius:8px"></div></div>
      <div class="skeleton skeleton-line" style="width:65%;height:15px"></div>
      <div class="skeleton skeleton-line" style="width:88%"></div>
      <div class="skeleton skeleton-line" style="width:42%;margin-top:14px"></div>
    </div>`).join('');
}

async function loadAndRender() {
  renderSkeletons();
  const data = await Schedura.api('/api/projects');
  if (!data.ok) {
    document.getElementById('projectsGrid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <h3>Could not load your projects</h3>
        <p>${escHtml(data.error || 'Something went wrong reaching the server.')}</p>
        <div class="empty-actions"><button class="btn btn-primary" onclick="loadAndRender()">Try again</button></div>
      </div>`;
    return;
  }
  allProjects = data.projects || [];
  renderProjects();
}

/* ── Rendering ───────────────────────────────────────────────────────────── */

function renderProjects() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim().replace(/\s+/g, ' ');
  const projects = allProjects.filter(p => p.name.toLowerCase().trim().replace(/\s+/g, ' ').includes(query));
  const grid = document.getElementById('projectsGrid');

  if (!projects.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <h3>${query ? 'No matching projects' : 'No projects yet'}</h3>
        <p>${query
          ? 'Nothing matches that search. Try a shorter term.'
          : 'A project holds one school’s standards, teachers, rooms and rules — and the timetable built from them.'}</p>
        <div class="empty-actions">
          ${query
            ? `<button class="btn" onclick="clearSearch()">Clear search</button>`
            : `<button class="btn btn-primary" id="emptyNewBtn">Create your first project</button>`}
        </div>
      </div>`;
    const b = document.getElementById('emptyNewBtn');
    if (b) b.onclick = createProject;
    return;
  }

  grid.innerHTML = projects.map(p => {
    const c = p.counts || {};
    const parts = [];
    if (c.standards) parts.push(`${c.standards} standard${c.standards === 1 ? '' : 's'}`);
    if (c.divisions) parts.push(`${c.divisions} division${c.divisions === 1 ? '' : 's'}`);
    if (c.faculty)   parts.push(`${c.faculty} teacher${c.faculty === 1 ? '' : 's'}`);
    const summary = parts.length ? parts.join(' · ') : 'Empty — nothing added yet';

    const when = p.lastGeneratedAt
      ? `Generated ${relTime(p.lastGeneratedAt)}`
      : `Edited ${relTime(p.updatedAt)}`;

    return `
    <div class="project-card" tabindex="0" role="link"
         onclick="openProject(${escAttr(p.id)})"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openProject(${escAttr(p.id)})}">
      <div class="project-card-top">
        <div class="project-icon">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        </div>
        <div class="menu-wrap" onclick="event.stopPropagation()">
          <button class="btn-icon" aria-label="More actions for ${escHtml(p.name)}"
                  onclick="toggleMenu('menu-${escHtml(p.id)}')">&#8943;</button>
          <div class="dropdown" id="menu-${escHtml(p.id)}">
            <button onclick="startRename(${escAttr(p.id)}, ${escAttr(p.name)})">Rename</button>
            <button onclick="duplicateProject(${escAttr(p.id)})">Duplicate</button>
            <button onclick="openShare(${escAttr(p.id)}, ${escAttr(p.name)})">Share link…</button>
            <button class="danger" onclick="deleteProject(${escAttr(p.id)})">Delete</button>
          </div>
        </div>
      </div>

      <div class="project-name">${escHtml(p.name)}</div>
      <div class="project-sub">${escHtml(summary)}</div>

      <div class="project-meta">
        <span class="badge ${p.hasOutput ? 'badge-done' : 'badge-draft'}">${p.hasOutput ? `${c.classes || 0} classes` : 'Draft'}</span>
        ${p.shared ? `<span class="badge badge-info">Shared</span>` : ''}
        <span style="margin-left:auto">${escHtml(when)}</span>
      </div>

      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn btn-sm" onclick="openProject(${escAttr(p.id)})">Open</button>
        ${p.hasOutput ? `<button class="btn btn-sm" onclick="openProject(${escAttr(p.id)}, 'schedule')">Schedule</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  renderProjects();
}

/* ── Menus ───────────────────────────────────────────────────────────────── */

let openMenu = null;
function toggleMenu(id) {
  const el = document.getElementById(id);
  if (openMenu && openMenu !== el) openMenu.classList.remove('open');
  el.classList.toggle('open');
  openMenu = el.classList.contains('open') ? el : null;
}
document.addEventListener('click', () => { if (openMenu) { openMenu.classList.remove('open'); openMenu = null; } });

/* ── Actions ─────────────────────────────────────────────────────────────── */

function openProject(id, step = 'standards') {
  location.href = `/projects/${encodeURIComponent(id)}/${step}`;
}

async function createProject() {
  const name = await Schedura.promptText({
    title: 'New project',
    body: 'A project holds one school’s inputs and the timetable built from them.',
    label: 'Project name',
    placeholder: 'e.g. Term 2, 2026',
    confirmLabel: 'Create project',
    maxLength: 60
  });
  if (!name) return;

  const data = await Schedura.api('/api/projects', { method: 'POST', body: JSON.stringify({ name }) });
  if (!data.ok) { toast(data.error || 'Could not create project', { type: 'error' }); return; }
  openProject(data.project.id);
}

async function startRename(id, currentName) {
  const name = await Schedura.promptText({
    title: 'Rename project', label: 'Project name', value: currentName, confirmLabel: 'Rename', maxLength: 60
  });
  if (!name || name === currentName) return;

  const prev = allProjects.find(p => p.id === id);
  const data = await Schedura.api(`/api/projects/${id}`, { method: 'PUT', body: JSON.stringify({ name }) });
  if (!data.ok) { toast(data.error || 'Could not rename', { type: 'error' }); return; }
  if (prev) { prev.name = name; renderProjects(); }

  toast(`Renamed to “${name}”`, {
    action: 'Undo',
    onAction: async () => {
      await Schedura.api(`/api/projects/${id}`, { method: 'PUT', body: JSON.stringify({ name: currentName }) });
      if (prev) { prev.name = currentName; renderProjects(); }
    }
  });
}

async function duplicateProject(id) {
  const t = toast('Duplicating…', { duration: 20000 });
  const data = await Schedura.api(`/api/projects/${id}`);
  if (!data.ok || !data.project) { t.dismiss(); toast('Could not read that project', { type: 'error' }); return; }
  const p = data.project;

  const created = await Schedura.api('/api/projects', { method: 'POST', body: JSON.stringify({ name: p.name + ' (copy)' }) });
  if (!created.ok) { t.dismiss(); toast('Could not create the copy', { type: 'error' }); return; }

  await Schedura.api(`/api/projects/${created.project.id}`, {
    method: 'PUT',
    body: JSON.stringify({
      standards: p.standards, faculty: p.faculty, assignments: p.assignments,
      classrooms: p.classrooms, selectedDays: p.selectedDays, timeSlotValues: p.timeSlotValues,
      hardConstraints: p.hardConstraints, softConstraints: p.softConstraints, breakTime: p.breakTime,
      scheduleData: p.scheduleData, scheduleStats: p.scheduleStats, generatedFilename: p.generatedFilename
    })
  });
  t.dismiss();
  await loadAndRender();
  toast(`Copied to “${p.name} (copy)”`, { type: 'success' });
}

/**
 * Deleting is a trash move, not an erase, so this can offer Undo rather than
 * stopping to ask first. The project keeps its id — and therefore its URL and
 * any share link — when it comes back.
 */
async function deleteProject(id) {
  const project = allProjects.find(p => p.id === id);
  if (!project) return;

  const data = await Schedura.api(`/api/projects/${id}`, { method: 'DELETE' });
  if (!data.ok) { toast(data.error || 'Could not delete', { type: 'error' }); return; }

  allProjects = allProjects.filter(p => p.id !== id);
  renderProjects();

  toast(`“${project.name}” deleted`, {
    action: 'Undo',
    onAction: async () => {
      const restored = await Schedura.api(`/api/projects/${id}/restore`, { method: 'POST' });
      if (!restored.ok) { toast('Could not restore — it may have been erased', { type: 'error' }); return; }
      await loadAndRender();
      toast('Project restored', { type: 'success' });
    }
  });
}

/* ── Share ───────────────────────────────────────────────────────────────── */

async function openShare(id, name) {
  const data = await Schedura.api(`/api/projects/${id}`);
  if (!data.ok || !data.project) { toast('Could not read that project', { type: 'error' }); return; }

  if (!data.project.scheduleData) {
    toast('Generate a schedule first — there is nothing to share yet', { type: 'error' });
    return;
  }
  renderShareModal(id, name, data.project.share || null);
}

function shareUrl(share) { return `${location.origin}/s/${share.id}`; }

function renderShareModal(id, name, share) {
  const on = !!(share && share.enabled);
  const m = Schedura.modal({
    title: 'Share schedule',
    html: `
      <p style="font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.55">
        Anyone with the link can view the generated timetable for
        <strong style="color:var(--text)">${escHtml(name)}</strong> — read-only, no sign-in needed.
        Your inputs and rules stay private.
      </p>
      <div id="shareBody"></div>`
  });

  const body = () => {
    const el = m.root.querySelector('#shareBody');
    if (on) {
      el.innerHTML = `
        <label for="shareInput">Public link</label>
        <div class="share-link-row">
          <input id="shareInput" type="text" readonly value="${escHtml(shareUrl(share))}">
          <button class="btn btn-sm" id="copyShare">Copy</button>
        </div>
        <div class="modal-actions">
          <button class="btn btn-danger" id="offShare">Turn off link</button>
          <button class="btn btn-primary" id="doneShare">Done</button>
        </div>`;
      el.querySelector('#copyShare').onclick = async () => {
        const input = el.querySelector('#shareInput');
        input.select();
        try { await navigator.clipboard.writeText(input.value); toast('Link copied', { type: 'success' }); }
        catch { document.execCommand('copy'); toast('Link copied', { type: 'success' }); }
      };
      el.querySelector('#offShare').onclick = async () => {
        const r = await Schedura.api(`/api/projects/${id}/share`, { method: 'DELETE' });
        if (!r.ok) { toast('Could not turn the link off', { type: 'error' }); return; }
        m.close();
        toast('Share link turned off');
        loadAndRender();
      };
      el.querySelector('#doneShare').onclick = () => { m.close(); loadAndRender(); };
    } else {
      el.innerHTML = `
        <div class="modal-actions">
          <button class="btn" id="cancelShare">Cancel</button>
          <button class="btn btn-primary" id="onShare">Create link</button>
        </div>`;
      el.querySelector('#cancelShare').onclick = () => m.close();
      el.querySelector('#onShare').onclick = async () => {
        const r = await Schedura.api(`/api/projects/${id}/share`, { method: 'POST' });
        if (!r.ok) { toast('Could not create the link', { type: 'error' }); return; }
        share = r.share;
        renderShareModalAgain();
      };
    }
  };

  const renderShareModalAgain = () => { m.close(); renderShareModal(id, name, share); };
  body();
}

/* ── Boot ────────────────────────────────────────────────────────────────── */

document.getElementById('newProjectBtn').onclick = createProject;
document.getElementById('signOutBtn').onclick    = () => Schedura.auth.signOut();
document.getElementById('searchInput').oninput   = renderProjects;

// "/" focuses search, the way every list view worth using does.
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'n' && (e.metaKey || e.ctrlKey) && !e.shiftKey) { e.preventDefault(); createProject(); }
});

(async () => {
  if (!(await Schedura.auth.require())) return;
  Schedura.paintUser();
  loadAndRender();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Projects · Schedura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:             #F5F2EB;
      --surface:        #FFFFFF;
      --surface-alt:    #FBF9F4;
      --surface-sunken: #F0ECE2;
      --border:         #E0DACE;
      --border-strong:  #C8C0AF;
      --text:           #1F232B;
      --text-secondary: #4A4F59;
      --muted:          #7C776E;
      --accent:         #2C4A70;
      --accent-hover:   #1E3553;
      --accent-soft:    #ECF1F7;
      --accent-border:  #C3D2E4;
      --success:        #2A6B47;
      --success-soft:   #EBF3EE;
      --success-border: #BFD9CB;
      --danger:         #A32B22;
      --danger-soft:    #FAEDEC;
      --danger-border:  #E6C5C2;
      --radius:         6px;
      --shadow-sm:      0 1px 2px rgba(31,35,43,0.05);
      --shadow-md:      0 4px 14px rgba(31,35,43,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOP BAR ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }

    .nav-brand {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-right { display: flex; align-items: center; gap: 14px; }

    .user-email {
      font-size: 13px;
      color: var(--muted);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-signout {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 6px 13px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn-signout:hover { background: var(--surface-sunken); border-color: var(--muted); }

    /* ── LAYOUT ── */
    .main { max-width: 1060px; margin: 0 auto; padding: 40px 28px 64px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .page-header h1 {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .page-header p { color: var(--muted); font-size: 14px; margin-top: 5px; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    /* ── SEARCH ── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 13px;
      margin-bottom: 22px;
      transition: border-color .15s, box-shadow .15s;
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-bar svg { color: var(--muted); flex-shrink: 0; }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 10px 0;
    }

    .search-bar input::placeholder { color: var(--muted); }

    /* ── PROJECT GRID ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .project-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .project-icon {
      width: 34px; height: 34px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .project-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-meta {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .badge-done  { background: var(--success-soft); color: var(--success); border: 1px solid var(--success-border); }
    .badge-draft { background: var(--surface-sunken); color: var(--muted); border: 1px solid var(--border); }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .card-action-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 6px 4px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }

    .card-action-btn:hover { background: var(--surface-sunken); border-color: var(--border-strong); color: var(--text); }
    .card-action-btn.danger:hover { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }

    /* ── DROPDOWN ── */
    .project-menu-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      transition: background .15s, color .15s;
    }

    .project-menu-btn:hover { background: var(--surface-sunken); color: var(--text); }

    .dropdown {
      position: absolute;
      top: 46px; right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      z-index: 50;
      min-width: 150px;
      box-shadow: var(--shadow-md);
      display: none;
    }

    .dropdown.open { display: block; }

    .dropdown button {
      display: block;
      width: 100%; padding: 9px 13px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }

    .dropdown button:hover { background: var(--surface-sunken); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 72px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .empty-state svg { color: var(--border-strong); margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 7px; font-weight: 600; }
    .empty-state p { font-size: 14px; margin-bottom: 22px; }
    .empty-state .btn-primary { display: inline-flex; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(31,35,43,0.34);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 16px 48px rgba(31,35,43,0.18);
    }

    .modal h2 { font-size: 17px; margin-bottom: 6px; font-weight: 600; }
    .modal p  { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

    .modal label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 7px;
    }

    .modal input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      margin-bottom: 20px;
    }

    .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .modal-actions { display: flex; gap: 9px; justify-content: flex-end; }

    .btn-cancel {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-cancel:hover { background: var(--surface-sunken); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--text);
      border-radius: var(--radius);
      padding: 11px 17px;
      font-size: 13px;
      color: #fff;
      box-shadow: var(--shadow-md);
      z-index: 999;
      transform: translateY(70px);
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .user-email { display: none; }
      .main { padding: 28px 16px 48px; }
      .page-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="dashboard.html">Schedura</a>
  <div class="nav-right">
    <span class="user-email" id="navEmail"></span>
    <button class="btn-signout" onclick="doLogout()">Sign out</button>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Projects</h1>
      <p>Open a project to edit its inputs and view the generated schedule.</p>
    </div>
    <button class="btn-primary" onclick="openNewModal()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New project
    </button>
  </div>

  <div class="search-bar">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search projects" oninput="renderProjects()"/>
  </div>

  <div class="projects-grid" id="projectsGrid"></div>
</main>

<!-- NEW PROJECT MODAL -->
<div class="modal-backdrop" id="newModal">
  <div class="modal">
    <h2>New project</h2>
    <p>Give your project a name. You can rename it later.</p>
    <label for="newProjectName">Project name</label>
    <input type="text" id="newProjectName" placeholder="Your project" maxlength="60"
      onkeydown="if(event.key==='Enter') createProject()"/>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewModal()">Cancel</button>
      <button class="btn-primary" onclick="createProject()">Create project</button>
    </div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="modal-backdrop" id="renameModal">
  <div class="modal">
    <h2>Rename project</h2>
    <p>Enter a new name for this project.</p>
    <label for="renameInput">Project name</label>
    <input type="text" id="renameInput" maxlength="60"
      onkeydown="if(event.key==='Enter') confirmRename()"/>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeRenameModal()">Cancel</button>
      <button class="btn-primary" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API   = '';  // relative — works on any host
const TOKEN = sessionStorage.getItem('auth_token');
const EMAIL = sessionStorage.getItem('auth_email');

if (!TOKEN) location.href = 'login.html';
document.getElementById('navEmail').textContent = EMAIL || '';

// ── API helper ──
async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...(options.headers||{}) }
  });
  if (res.status === 401) { doLogout(); return null; }
  return res.json();
}

let allProjects = [];

// ── Load from server ──
async function loadAndRender() {
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = `<div style="grid-column:1/-1;padding:56px;text-align:center;color:var(--muted);font-size:14px">Loading projects…</div>`;
  const data = await apiFetch('/api/projects');
  if (!data) return;
  allProjects = data.projects || [];
  renderProjects();
}

// ── Render list ──
function renderProjects() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim().replace(/\s+/g, ' ');
  const projects = allProjects.filter(p => p.name.toLowerCase().trim().replace(/\s+/g, ' ').includes(query));
  const grid = document.getElementById('projectsGrid');

  if (projects.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <h3>${query ? 'No matching projects' : 'No projects yet'}</h3>
        <p>${query ? 'Try a different search term.' : 'Create your first project to get started.'}</p>
        ${!query ? `<button class="btn-primary" onclick="openNewModal()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          New project</button>` : ''}
      </div>`;
    return;
  }

  grid.innerHTML = projects.map(p => {
    const date = new Date(p.updatedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    return `
    <div class="project-card" onclick="openProject(${escAttr(p.id)})">
      <div class="project-card-top">
        <div class="project-icon">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        </div>
        <button class="project-menu-btn" onclick="event.stopPropagation(); toggleMenu('menu-${p.id}')" title="More actions">&#8943;</button>
        <div class="dropdown" id="menu-${p.id}">
          <button onclick="event.stopPropagation(); duplicateProject(${escAttr(p.id)})">Duplicate</button>
        </div>
      </div>
      <div class="project-name">${escHtml(p.name)}</div>
      <div class="project-meta">
        <span>Updated ${date}</span>
        <span class="badge ${p.hasOutput ? 'badge-done' : 'badge-draft'}">${p.hasOutput ? 'Generated' : 'Draft'}</span>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="card-action-btn" onclick="openProject(${escAttr(p.id)})">Open</button>
        <button class="card-action-btn" onclick="startRename(${escAttr(p.id)}, ${escAttr(p.name)})">Rename</button>
        <button class="card-action-btn danger" onclick="deleteProject(${escAttr(p.id)})">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Safely embed a value as a JS string literal inside an inline handler attribute.
function escAttr(value) {
  return escHtml(JSON.stringify(String(value)));
}

// ── Menu toggle ──
let openMenu = null;
function toggleMenu(id) {
  const el = document.getElementById(id);
  if (openMenu && openMenu !== el) openMenu.classList.remove('open');
  el.classList.toggle('open');
  openMenu = el.classList.contains('open') ? el : null;
}
document.addEventListener('click', () => { if (openMenu) { openMenu.classList.remove('open'); openMenu = null; } });

// ── Open ──
function openProject(id) {
  sessionStorage.setItem('active_project_id', id);
  location.href = 'index.html';
}

// ── Create ──
function openNewModal() {
  document.getElementById('newProjectName').value = '';
  document.getElementById('newModal').classList.add('open');
  setTimeout(() => document.getElementById('newProjectName').focus(), 80);
}
function closeNewModal() { document.getElementById('newModal').classList.remove('open'); }

async function createProject() {
  const name = document.getElementById('newProjectName').value.trim();
  if (!name) return;
  const data = await apiFetch('/api/projects', { method: 'POST', body: JSON.stringify({ name }) });
  if (!data || !data.success) { showToast('Could not create project'); return; }
  closeNewModal();
  sessionStorage.setItem('active_project_id', data.project.id);
  location.href = 'index.html';
}

// ── Rename ──
let renamingId = null;
function startRename(id, currentName) {
  renamingId = id;
  document.getElementById('renameInput').value = currentName;
  document.getElementById('renameModal').classList.add('open');
  setTimeout(() => document.getElementById('renameInput').focus(), 80);
}
function closeRenameModal() { document.getElementById('renameModal').classList.remove('open'); renamingId = null; }

async function confirmRename() {
  const name = document.getElementById('renameInput').value.trim();
  if (!name || !renamingId) return;
  await apiFetch(`/api/projects/${renamingId}`, { method: 'PUT', body: JSON.stringify({ name }) });
  closeRenameModal();
  await loadAndRender();
  showToast('Project renamed');
}

// ── Duplicate ──
async function duplicateProject(id) {
  const data = await apiFetch(`/api/projects/${id}`);
  if (!data || !data.project) return;
  const p = data.project;
  const created = await apiFetch('/api/projects', { method: 'POST', body: JSON.stringify({ name: p.name + ' (copy)' }) });
  if (!created || !created.success) return;
  await apiFetch(`/api/projects/${created.project.id}`, {
    method: 'PUT',
    body: JSON.stringify({
      standards: p.standards, faculty: p.faculty, assignments: p.assignments,
      classrooms: p.classrooms, selectedDays: p.selectedDays, timeSlotValues: p.timeSlotValues,
      hardConstraints: p.hardConstraints, softConstraints: p.softConstraints, breakTime: p.breakTime,
      scheduleData: p.scheduleData, scheduleStats: p.scheduleStats, generatedFilename: p.generatedFilename
    })
  });
  await loadAndRender();
  showToast('Project duplicated');
}

// ── Delete ──
async function deleteProject(id) {
  if (!confirm('Delete this project? This cannot be undone.')) return;
  await apiFetch(`/api/projects/${id}`, { method: 'DELETE' });
  allProjects = allProjects.filter(p => p.id !== id);
  renderProjects();
  showToast('Project deleted');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function doLogout() {
  sessionStorage.removeItem('auth_token');
  sessionStorage.removeItem('auth_email');
  sessionStorage.removeItem('active_project_id');
  location.href = 'login.html';
}

loadAndRender();
</script>
</body>
</html>

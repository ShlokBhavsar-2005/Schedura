<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – Timetable Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans', sans-serif; }

    body {
      min-height: 100vh;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-area .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .logo-area h1 {
      font-size: 24px;
      color: #e2e8f0;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
    }

    .logo-area p {
      color: #64748b;
      font-size: 14px;
      margin-top: 6px;
    }

    .login-card {
      background: #1a1d27;
      border: 1px solid #2e3250;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    .login-card h2 {
      font-size: 20px;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 7px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .alert.show { display: block; }

    .alert-error   { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .alert-success { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }

    #googleBtnContainer {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      font-size: 12px;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="logo-area">
    <span class="icon">📚</span>
    <h1>Timetable Generator</h1>
    <p>Conflict-free scheduling with Genetic Algorithms</p>
  </div>

  <div class="login-card">
    <h2>Welcome</h2>
    <p class="subtitle">Sign in with Google to access your projects</p>

    <div id="alertBox" class="alert"></div>

    <div id="googleBtnContainer"><div class="spinner"></div></div>
  </div>
</div>

<script>
  const API_BASE_URL = '';  // relative — works on any host

  // If already logged in, go straight to app
  if (sessionStorage.getItem('auth_token')) {
    window.location.href = '/dashboard.html';
  }

  function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = `alert alert-${type} show`;
  }

  function hideAlert() {
    document.getElementById('alertBox').className = 'alert';
  }

  async function handleGoogleCredential(response) {
    hideAlert();
    try {
      const res  = await fetch(`${API_BASE_URL}/api/auth/google`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        sessionStorage.setItem('auth_token', data.token);
        sessionStorage.setItem('auth_email', data.email);
        showAlert('Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      } else {
        showAlert(data.error || 'Google sign-in failed.', 'error');
      }
    } catch (err) {
      showAlert('⚠️ Cannot reach the server. Make sure the backend is running.', 'error');
    }
  }

  // The GSI <script> tag loads asynchronously, so wait for window.google.accounts
  // to actually appear (polling, since the script has no reliable onload hook here).
  function waitForGoogleSdk(timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function check() {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          resolve();
        } else if (Date.now() - start > timeoutMs) {
          reject(new Error('Google Sign-In script failed to load in time.'));
        } else {
          setTimeout(check, 100);
        }
      })();
    });
  }

  async function initGoogleSignIn() {
    const container = document.getElementById('googleBtnContainer');
    try {
      const res  = await fetch(`${API_BASE_URL}/api/config`);
      const data = await res.json();

      if (!data.googleClientId) {
        container.innerHTML = '';
        showAlert('Google Sign-In is not configured on this server yet.', 'error');
        return;
      }

      try {
        await waitForGoogleSdk();
      } catch {
        container.innerHTML = '';
        showAlert('Could not load Google Sign-In. Check your connection and reload.', 'error');
        return;
      }

      google.accounts.id.initialize({
        client_id: data.googleClientId,
        callback: handleGoogleCredential
      });

      container.innerHTML = '';
      google.accounts.id.renderButton(container, {
        theme: 'filled_blue',
        size: 'large',
        width: 300,
        text: 'signin_with'
      });
    } catch (err) {
      container.innerHTML = '';
      showAlert('⚠️ Cannot reach the server. Make sure the backend is running.', 'error');
    }
  }

  initGoogleSignIn();
</script>
</body>
</html>

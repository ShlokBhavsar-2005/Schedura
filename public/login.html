<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in · Schedura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg:             #F5F2EB;
      --surface:        #FFFFFF;
      --surface-alt:    #FBF9F4;
      --border:         #E0DACE;
      --border-strong:  #C8C0AF;
      --text:           #1F232B;
      --text-secondary: #4A4F59;
      --muted:          #7C776E;
      --accent:         #2C4A70;
      --danger:         #A32B22;
      --danger-soft:    #FAEDEC;
      --danger-border:  #E6C5C2;
      --success:        #2A6B47;
      --success-soft:   #EBF3EE;
      --success-border: #BFD9CB;
      --radius:         6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrapper { width: 100%; max-width: 400px; }

    .brand { text-align: center; margin-bottom: 32px; }

    .brand h1 {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand .rule {
      width: 36px;
      height: 2px;
      background: var(--accent);
      margin: 14px auto 12px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 1px 3px rgba(31,35,43,0.05);
      text-align: center;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .alert {
      padding: 11px 13px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .alert.show { display: block; }

    .alert-error   { background: var(--danger-soft);  color: var(--danger);  border: 1px solid var(--danger-border); }
    .alert-success { background: var(--success-soft); color: var(--success); border: 1px solid var(--success-border); }

    #googleBtnContainer {
      display: flex;
      justify-content: center;
      min-height: 44px;
      align-items: center;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand">
    <h1>Schedura</h1>
    <div class="rule"></div>
    <p>Automated conflict-free schedule planning</p>
  </div>

  <div class="card">
    <h2>Sign in</h2>
    <p class="subtitle">Use your Google account to access your projects.</p>

    <div id="alertBox" class="alert"></div>

    <div id="googleBtnContainer"><div class="spinner"></div></div>
  </div>

  <footer>Your projects are private to your account.</footer>
</div>

<script>
  const API_BASE_URL = '';  // relative — works on any host

  // If already logged in, go straight to app
  if (sessionStorage.getItem('auth_token')) {
    window.location.href = '/dashboard.html';
  }

  function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = `alert alert-${type} show`;
  }

  function hideAlert() {
    document.getElementById('alertBox').className = 'alert';
  }

  async function handleGoogleCredential(response) {
    hideAlert();
    try {
      const res  = await fetch(`${API_BASE_URL}/api/auth/google`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        sessionStorage.setItem('auth_token', data.token);
        sessionStorage.setItem('auth_email', data.email);
        showAlert('Signed in. Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      } else {
        showAlert(data.error || 'Google sign-in failed.', 'error');
      }
    } catch (err) {
      showAlert('Cannot reach the server. Make sure the backend is running.', 'error');
    }
  }

  // The GSI <script> tag loads asynchronously, so wait for window.google.accounts
  // to actually appear (polling, since the script has no reliable onload hook here).
  function waitForGoogleSdk(timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function check() {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          resolve();
        } else if (Date.now() - start > timeoutMs) {
          reject(new Error('Google Sign-In script failed to load in time.'));
        } else {
          setTimeout(check, 100);
        }
      })();
    });
  }

  async function initGoogleSignIn() {
    const container = document.getElementById('googleBtnContainer');
    try {
      const res  = await fetch(`${API_BASE_URL}/api/config`);
      const data = await res.json();

      if (!data.googleClientId) {
        container.innerHTML = '';
        showAlert('Google Sign-In is not configured on this server yet.', 'error');
        return;
      }

      try {
        await waitForGoogleSdk();
      } catch {
        container.innerHTML = '';
        showAlert('Could not load Google Sign-In. Check your connection and reload.', 'error');
        return;
      }

      google.accounts.id.initialize({
        client_id: data.googleClientId,
        callback: handleGoogleCredential
      });

      container.innerHTML = '';
      google.accounts.id.renderButton(container, {
        theme: 'outline',
        size: 'large',
        width: 300,
        text: 'signin_with',
        shape: 'rectangular'
      });
    } catch (err) {
      container.innerHTML = '';
      showAlert('Cannot reach the server. Make sure the backend is running.', 'error');
    }
  }

  initGoogleSignIn();
</script>
</body>
</html>
